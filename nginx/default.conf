upstream frontend{
    server frontend:3000;
}

upstream students{
    server studentservice:5001;
}

upstream teachers{
    server  teacherservice:5002;
}

upstream employees{
    server employeeservice:5003;
}

upstream profile{
    server profileservice:5004;
}

upstream storage{
    server object-storage:9000;
}

server{
    listen 80;

     location / {
        proxy_pass http://frontend;
    }

    location /api/students/ {
        proxy_pass http://students/;
    }

    location /api/teachers/ {
        proxy_pass http://teachers/;
    }

    location /api/employees/ {
        proxy_pass http://employees/;
    }

    location /api/profile/ {
        proxy_pass http://profile/;
    }

     location /storage/ {
        proxy_pass http://storage/;
        proxy_set_header Host object-storage:9000;     
    }
}